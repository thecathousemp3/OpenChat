<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">OpenChat local profile and encrypted backup</title>
  <desc id="description">The active profile and recent conversations stay in unencrypted browser storage. Saving a backup encrypts an export with a password using PBKDF2 and AES-256-GCM before creating a file.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#101010"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#1d1d1d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ddd"/></marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="600" y="62" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">Your live profile and your backup are different</text>
  <text x="600" y="94" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">The password protects the exported file, not the browser data you use every day.</text>

  <rect x="52" y="145" width="338" height="250" rx="14" fill="url(#card)" stroke="#666"/>
  <text x="221" y="181" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700">This browser</text>
  <rect x="147" y="202" width="148" height="108" rx="7" fill="#101010" stroke="#aaa" stroke-width="2"/>
  <text x="221" y="246" fill="#eee" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Profile + chats</text>
  <text x="221" y="271" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Local browser data</text>
  <path d="M136 318h170m-105 0 10 13h20l10-13" stroke="#ddd" stroke-width="3" fill="none"/>
  <text x="221" y="367" fill="#f2b6b6" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700">Not encrypted at rest</text>

  <path d="M404 269h38" stroke="#ddd" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="423" y="242" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="12">Save</text>
  <rect x="448" y="145" width="304" height="250" rx="14" fill="url(#card)" stroke="#666"/>
  <text x="600" y="181" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700">Encrypt in browser</text>
  <path d="M568 248v-18a32 32 0 0 1 64 0v18m-74 0h84v62h-84z" fill="none" stroke="#eee" stroke-width="4"/>
  <circle cx="610" cy="275" r="6" fill="#eee"/>
  <path d="M610 281v13" stroke="#eee" stroke-width="4"/>
  <text x="600" y="342" fill="#ccc" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Password-derived key</text>
  <text x="600" y="367" fill="#ccc" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">PBKDF2 + AES-256-GCM</text>

  <path d="M766 269h38" stroke="#ddd" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="810" y="145" width="338" height="250" rx="14" fill="url(#card)" stroke="#666"/>
  <text x="979" y="181" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700">Portable backup</text>
  <path d="M936 207h60l32 32v89h-92z" fill="#171717" stroke="#ddd" stroke-width="2"/>
  <path d="M996 207v33h32" fill="none" stroke="#ddd" stroke-width="2"/>
  <text x="982" y="272" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">.openchat</text>
  <text x="979" y="357" fill="#ccc" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Encrypted export file</text>

  <text x="600" y="444" fill="#ccc" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">Your password stays in the browser. OpenChat cannot recover a lost password.</text>
  <text x="600" y="476" fill="#aaa" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Keep the backup file and password safe and separately.</text>
  <text x="600" y="520" fill="#999" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Restore replaces the profile in that browser; it does not sync devices.</text>
</svg>
