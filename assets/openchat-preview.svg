<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">OpenChat desktop interface preview</title>
  <desc id="description">A dark, desktop-inspired messenger showing Global Chat, a friend list, and a sample conversation.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#242424"/>
    </pattern>
    <linearGradient id="titlebar" x2="0" y2="1">
      <stop stop-color="#535353"/>
      <stop offset=".2" stop-color="#353535"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="button" x2="0" y2="1">
      <stop stop-color="#414141"/>
      <stop offset="1" stop-color="#282828"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#090909"/>
  <rect width="1440" height="900" fill="url(#dots)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="55" width="1260" height="790" rx="8" fill="#151515" stroke="#4a4a4a"/>
    <path d="M98 56h1244a7 7 0 0 1 7 7v38H91V63a7 7 0 0 1 7-7z" fill="url(#titlebar)"/>
    <path d="M91 101h1258M91 811h1258" stroke="#484848"/>
    <rect x="108" y="69" width="19" height="19" rx="5" fill="#eee"/>
    <text x="117.5" y="83" fill="#202020" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="700">O</text>
    <text x="138" y="83" fill="#f5f5f5" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".5">OPENCHAT</text>
    <text x="220" y="83" fill="#d0d0d0" font-family="Tahoma,Arial,sans-serif" font-size="12">Instant Messenger</text>
    <g fill="url(#button)" stroke="#aaa">
      <rect x="1287" y="69" width="18" height="17" rx="2"/>
      <rect x="1310" y="69" width="18" height="17" rx="2"/>
      <rect x="1333" y="69" width="18" height="17" rx="2"/>
    </g>
    <g stroke="#f1f1f1" stroke-width="1.4">
      <path d="M1292 80h8M1315 74h8v7h-8zM1338 74l8 7m0-7-8 7"/>
    </g>
    <rect x="91" y="102" width="260" height="709" fill="#101010"/>
    <path d="M351 102v709M351 188h998M91 811h1258" stroke="#383838"/>
    <rect x="111" y="126" width="43" height="43" rx="12" fill="url(#button)" stroke="#555"/>
    <text x="132.5" y="154" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="700">MR</text>
    <text x="166" y="143" fill="#f4f4f4" font-family="Tahoma,Arial,sans-serif" font-size="14" font-weight="700">Morgan Reed</text>
    <text x="166" y="162" fill="#b8b8b8" font-family="Tahoma,Arial,sans-serif" font-size="11">Profile stored on this device</text>
    <text x="110" y="210" fill="#aaa" font-family="Tahoma,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CHATS</text>
    <rect x="105" y="222" width="232" height="43" rx="4" fill="url(#button)" stroke="#555"/>
    <rect x="118" y="235" width="18" height="18" rx="5" fill="#555"/>
    <text x="127" y="249" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700">#</text>
    <text x="148" y="249" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="12" font-weight="700">Global Chat</text>
    <text x="110" y="298" fill="#aaa" font-family="Tahoma,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">FRIENDS</text>
    <text x="311" y="298" fill="#aaa" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="10">1 online</text>
    <rect x="112" y="313" width="31" height="31" rx="9" fill="#343434"/>
    <text x="127.5" y="334" fill="#eee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="12" font-weight="700">S</text>
    <text x="153" y="326" fill="#f1f1f1" font-family="Tahoma,Arial,sans-serif" font-size="11" font-weight="700">Sam Rivera</text>
    <text x="153" y="341" fill="#aaa" font-family="Tahoma,Arial,sans-serif" font-size="10">online · direct</text>
    <circle cx="322" cy="328" r="4" fill="#ddd"/>
    <g font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#eee" text-anchor="middle">
      <rect x="108" y="693" width="226" height="36" rx="4" fill="url(#button)" stroke="#444"/>
      <text x="221" y="716">+  Add a friend</text>
      <rect x="108" y="737" width="226" height="36" rx="4" fill="url(#button)" stroke="#444"/>
      <text x="221" y="760">#  Create a room</text>
    </g>
    <rect x="376" y="125" width="42" height="42" rx="9" fill="url(#button)" stroke="#414141"/>
    <text x="397" y="152" fill="#f4f4f4" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="700">S</text>
    <text x="434" y="145" fill="#f5f5f5" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="700">Sam Rivera</text>
    <text x="434" y="163" fill="#aaa" font-family="Tahoma,Arial,sans-serif" font-size="10">Direct message</text>
    <rect x="378" y="223" width="33" height="33" rx="9" fill="#343434"/>
    <text x="394.5" y="245" fill="#eee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="700">S</text>
    <text x="423" y="234" fill="#f0f0f0" font-family="Tahoma,Arial,sans-serif" font-size="11" font-weight="700">Sam Rivera</text>
    <text x="493" y="234" fill="#999" font-family="Tahoma,Arial,sans-serif" font-size="10">10:41 AM</text>
    <rect x="423" y="243" width="345" height="47" rx="5" fill="#252525" stroke="#343434"/>
    <text x="438" y="263" fill="#e5e5e5" font-family="Tahoma,Arial,sans-serif" font-size="12">Hey, good to see you online.</text>
    <text x="438" y="280" fill="#e5e5e5" font-family="Tahoma,Arial,sans-serif" font-size="12">How is the new room coming along?</text>
    <text x="1258" y="318" fill="#f0f0f0" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="11" font-weight="700">Morgan Reed</text>
    <text x="1312" y="318" fill="#999" font-family="Tahoma,Arial,sans-serif" font-size="10">10:42 AM</text>
    <rect x="904" y="328" width="394" height="46" rx="5" fill="#303030" stroke="#414141"/>
    <text x="920" y="356" fill="#f2f2f2" font-family="Tahoma,Arial,sans-serif" font-size="12">Just finished the first pass. Take a look.</text>
    <rect x="378" y="401" width="33" height="33" rx="9" fill="#343434"/>
    <text x="394.5" y="423" fill="#eee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="700">S</text>
    <text x="423" y="412" fill="#f0f0f0" font-family="Tahoma,Arial,sans-serif" font-size="11" font-weight="700">Sam Rivera</text>
    <text x="493" y="412" fill="#999" font-family="Tahoma,Arial,sans-serif" font-size="10">10:42 AM</text>
    <rect x="423" y="421" width="239" height="29" rx="5" fill="#252525" stroke="#343434"/>
    <text x="438" y="440" fill="#e5e5e5" font-family="Tahoma,Arial,sans-serif" font-size="12">Looks great. Send me the invite.</text>
    <rect x="376" y="752" width="940" height="49" rx="5" fill="#111" stroke="#454545"/>
    <text x="396" y="782" fill="#aaa" font-family="Tahoma,Arial,sans-serif" font-size="12">Write a message...</text>
    <rect x="1275" y="761" width="31" height="31" rx="4" fill="url(#button)" stroke="#555"/>
    <path d="M1285 769l12 8-12 8z" fill="#f4f4f4"/>
    <circle cx="109" cy="829" r="4" fill="#ddd"/>
    <text x="121" y="833" fill="#ccc" font-family="Tahoma,Arial,sans-serif" font-size="10">Online</text>
    <text x="1319" y="833" fill="#aaa" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="10">OpenChat</text>
  </g>
</svg>
