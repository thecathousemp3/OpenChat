<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">OpenChat interface preview</title>
  <desc id="description">A black and white pixel-style messenger with a room list, friend list, sample conversation, and message composer.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252525"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#070707"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <g filter="url(#shadow)" font-family="'Courier New',monospace">
    <rect x="80" y="52" width="1280" height="796" fill="#080808" stroke="#737373" stroke-width="2"/>
    <rect x="82" y="54" width="1276" height="52" fill="#101010"/>
    <path d="M81 106h1278M82 813h1276" stroke="#555"/>
    <rect x="106" y="68" width="22" height="22" fill="#0b0b0b" stroke="#eee"/>
    <text x="117" y="84" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">O</text>
    <text x="143" y="84" fill="#fff" font-size="15" font-weight="700" letter-spacing="1">OPENCHAT</text>
    <text x="244" y="84" fill="#aaa" font-size="12" letter-spacing=".5">INSTANT MESSENGER</text>
    <g fill="#090909" stroke="#aaa">
      <rect x="1276" y="68" width="23" height="22"/>
      <rect x="1308" y="68" width="23" height="22"/>
      <rect x="1340" y="68" width="23" height="22"/>
    </g>
    <g fill="#fff" font-size="13" text-anchor="middle">
      <text x="1287" y="83">-</text>
      <text x="1319" y="83">+</text>
      <text x="1351" y="83">x</text>
    </g>

    <rect x="82" y="107" width="280" height="706" fill="#060606"/>
    <path d="M362 107v706M82 813h1276" stroke="#444"/>
    <rect x="108" y="132" width="52" height="52" fill="#111" stroke="#aaa"/>
    <text x="134" y="164" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">AR</text>
    <text x="176" y="151" fill="#fff" font-size="14" font-weight="700">Ada Reed</text>
    <text x="176" y="172" fill="#aaa" font-size="11">PROFILE ON THIS DEVICE</text>
    <text x="108" y="221" fill="#aaa" font-size="10" font-weight="700" letter-spacing="1.5">CHATS</text>
    <rect x="103" y="235" width="238" height="45" fill="#eee"/>
    <text x="122" y="264" fill="#090909" font-size="17" font-weight="700">#</text>
    <text x="151" y="263" fill="#090909" font-size="13" font-weight="700">Global Chat</text>
    <text x="108" y="316" fill="#aaa" font-size="10" font-weight="700" letter-spacing="1.5">FRIENDS</text>
    <text x="337" y="316" fill="#aaa" text-anchor="end" font-size="10">2 ONLINE</text>
    <rect x="108" y="333" width="34" height="34" fill="#161616" stroke="#666"/>
    <text x="125" y="356" fill="#fff" text-anchor="middle" font-size="13" font-weight="700">M</text>
    <text x="154" y="347" fill="#eee" font-size="11" font-weight="700">Morgan Reed</text>
    <text x="154" y="364" fill="#999" font-size="10">ONLINE</text>
    <rect x="108" y="380" width="34" height="34" fill="#161616" stroke="#666"/>
    <text x="125" y="403" fill="#fff" text-anchor="middle" font-size="13" font-weight="700">J</text>
    <text x="154" y="394" fill="#eee" font-size="11" font-weight="700">Jamie Chen</text>
    <text x="154" y="411" fill="#999" font-size="10">ONLINE</text>
    <rect x="104" y="670" width="238" height="39" fill="#111" stroke="#666"/>
    <text x="223" y="695" fill="#fff" text-anchor="middle" font-size="11">+  ADD A FRIEND</text>
    <rect x="104" y="718" width="238" height="39" fill="#111" stroke="#666"/>
    <text x="223" y="743" fill="#fff" text-anchor="middle" font-size="11">#  CREATE A ROOM</text>
    <g fill="#111" stroke="#555">
      <rect x="104" y="766" width="114" height="34"/>
      <rect x="228" y="766" width="114" height="34"/>
    </g>
    <text x="161" y="788" fill="#eee" text-anchor="middle" font-size="10">SAVE PROFILE</text>
    <text x="285" y="788" fill="#eee" text-anchor="middle" font-size="10">RESTORE</text>

    <rect x="363" y="107" width="995" height="98" fill="#090909"/>
    <path d="M363 205h995" stroke="#444"/>
    <rect x="390" y="129" width="48" height="48" fill="#111" stroke="#777"/>
    <text x="414" y="160" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">#</text>
    <text x="457" y="151" fill="#fff" font-size="16" font-weight="700">Global Chat</text>
    <text x="457" y="174" fill="#999" font-size="10">SHARED ROOM</text>
    <rect x="1180" y="136" width="151" height="34" fill="#0c0c0c" stroke="#666"/>
    <text x="1199" y="158" fill="#fff" font-size="11" font-weight="700">i</text>
    <text x="1216" y="158" fill="#ddd" font-size="10">ABOUT WEBRTC</text>

    <rect x="363" y="206" width="995" height="607" fill="#080808"/>
    <rect x="363" y="206" width="995" height="607" fill="url(#grid)"/>
    <text x="396" y="248" fill="#eee" font-size="12" font-weight="700">Morgan Reed</text>
    <text x="521" y="248" fill="#888" font-size="10">10:41</text>
    <rect x="396" y="263" width="456" height="64" fill="#151515" stroke="#383838"/>
    <text x="414" y="289" fill="#ddd" font-size="12">Hey everyone, room is up.</text>
    <text x="414" y="309" fill="#aaa" font-size="11">Glad you made it.</text>
    <text x="1021" y="365" fill="#eee" text-anchor="end" font-size="12" font-weight="700">Ada Reed</text>
    <text x="1059" y="365" fill="#888" font-size="10">10:42</text>
    <rect x="826" y="379" width="505" height="45" fill="#191919" stroke="#555"/>
    <text x="846" y="407" fill="#eee" font-size="12">Thanks. Good to see everyone here.</text>
    <text x="396" y="472" fill="#eee" font-size="12" font-weight="700">Jamie Chen</text>
    <text x="514" y="472" fill="#888" font-size="10">10:43</text>
    <rect x="396" y="487" width="371" height="45" fill="#151515" stroke="#383838"/>
    <text x="414" y="515" fill="#ddd" font-size="12">The connection looks clear.</text>

    <rect x="389" y="750" width="944" height="44" fill="#090909" stroke="#666"/>
    <text x="409" y="777" fill="#999" font-size="11">Type a message...</text>
    <rect x="1284" y="756" width="39" height="32" fill="#eee"/>
    <text x="1303" y="777" fill="#090909" text-anchor="middle" font-size="10" font-weight="700">GO</text>
    <circle cx="101" cy="830" r="4" fill="#fff"/>
    <text x="115" y="834" fill="#aaa" font-size="9">ROOM CONNECTION STATUS</text>
    <text x="1335" y="834" fill="#999" text-anchor="end" font-size="9">SAMPLE PREVIEW</text>
  </g>
</svg>
