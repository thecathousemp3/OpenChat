<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">How an OpenChat room message travels</title>
  <desc id="description">Two participant browsers exchange room message data directly over a DTLS-protected WebRTC data channel. A separate server connection carries membership and WebRTC signaling, not room message text.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#101010"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#202020"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#eee"/></marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="600" y="62" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">Room messages go browser to browser</text>
  <text x="600" y="94" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">The server coordinates the room; it does not forward shared-room message text.</text>

  <rect x="55" y="153" width="270" height="170" rx="14" fill="url(#card)" stroke="#666"/>
  <rect x="157" y="178" width="66" height="48" rx="6" fill="#111" stroke="#aaa" stroke-width="2"/>
  <path d="M148 237h84m-53 0v9m22-9v9m-31 0h40" stroke="#ddd" stroke-width="3" fill="none"/>
  <text x="190" y="279" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">Browser A</text>
  <text x="190" y="303" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Room participant</text>

  <rect x="875" y="153" width="270" height="170" rx="14" fill="url(#card)" stroke="#666"/>
  <rect x="977" y="178" width="66" height="48" rx="6" fill="#111" stroke="#aaa" stroke-width="2"/>
  <path d="M968 237h84m-53 0v9m22-9v9m-31 0h40" stroke="#ddd" stroke-width="3" fill="none"/>
  <text x="1010" y="279" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">Browser B</text>
  <text x="1010" y="303" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Room participant</text>

  <path d="M342 225h90m336 0h90" stroke="#eee" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="440" y="172" width="320" height="106" rx="12" fill="#161616" stroke="#888"/>
  <text x="600" y="215" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">WebRTC data channel</text>
  <text x="600" y="245" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">DTLS encryption in transit</text>

  <path d="M190 324v37" stroke="#999" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#softArrow)"/>
  <path d="M1010 324v37" stroke="#999" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#softArrow)"/>
  <text x="600" y="350" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Separate WebSocket signaling path</text>
  <rect x="270" y="376" width="660" height="112" rx="14" fill="#171717" stroke="#555"/>
  <text x="600" y="414" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">OpenChat room server</text>
  <text x="600" y="441" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Room membership, profile details, WebRTC offers and answers</text>
  <text x="600" y="466" fill="#999" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Room message text is not sent through the server.</text>
  <text x="600" y="526" fill="#aaa" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Transport encryption does not authenticate peer identity; the server can see signaling metadata.</text>
</svg>
