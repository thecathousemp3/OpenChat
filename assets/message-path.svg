<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">How an OpenChat room message travels</title>
  <desc id="description">Two participant browsers exchange room message data directly over a DTLS-protected WebRTC data channel. A separate server connection carries membership and WebRTC signaling, not room message text.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#101010"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#202020"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#eee"/></marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="540" rx="18" fill="url(#bg)"/>
  <text x="54" y="64" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Room messages go browser to browser</text>
  <text x="54" y="94" fill="#bbb" font-family="Arial,sans-serif" font-size="15">The server coordinates the room; it does not forward shared-room message text.</text>
  <rect x="55" y="160" width="300" height="154" rx="12" fill="url(#card)" stroke="#666"/>
  <rect x="85" y="190" width="68" height="53" rx="6" fill="#111" stroke="#aaa" stroke-width="2"/>
  <path d="M77 255h84m-53 0v9m22-9v9m-31 0h40" stroke="#ddd" stroke-width="3" fill="none"/>
  <text x="180" y="211" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Browser A</text>
  <text x="180" y="239" fill="#bbb" font-family="Arial,sans-serif" font-size="14">Room member</text>
  <text x="180" y="265" fill="#bbb" font-family="Arial,sans-serif" font-size="14">Message stored locally</text>
  <rect x="845" y="160" width="300" height="154" rx="12" fill="url(#card)" stroke="#666"/>
  <rect x="875" y="190" width="68" height="53" rx="6" fill="#111" stroke="#aaa" stroke-width="2"/>
  <path d="M867 255h84m-53 0v9m22-9v9m-31 0h40" stroke="#ddd" stroke-width="3" fill="none"/>
  <text x="970" y="211" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Browser B</text>
  <text x="970" y="239" fill="#bbb" font-family="Arial,sans-serif" font-size="14">Room member</text>
  <text x="970" y="265" fill="#bbb" font-family="Arial,sans-serif" font-size="14">Message stored locally</text>
  <path d="M370 220h450" stroke="#eee" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="484" y="183" width="238" height="68" rx="10" fill="#161616" stroke="#888"/>
  <text x="603" y="210" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">WebRTC data channel</text>
  <text x="603" y="233" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">DTLS encryption in transit</text>
  <rect x="442" y="361" width="316" height="104" rx="12" fill="#171717" stroke="#555"/>
  <text x="600" y="393" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">OpenChat room server</text>
  <text x="600" y="421" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Membership, profile details,</text>
  <text x="600" y="444" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">WebRTC offers and answers</text>
  <path d="M260 322c0 47 52 55 155 55m530 0c103 0 155-8 155-55" stroke="#999" stroke-width="2.5" stroke-dasharray="8 8" fill="none" marker-end="url(#softArrow)"/>
  <path d="M410 377h410" stroke="#999" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#softArrow)"/>
  <text x="600" y="351" fill="#bbb" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Separate WebSocket signaling path</text>
  <text x="600" y="504" fill="#aaa" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">The server still sees room membership and signaling metadata. Transport encryption does not authenticate peer identity.</text>
</svg>
